<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #16C5E0; /* sky blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden; /* Prevents scrollbars when button gets huge */
        }

        .container {
            position: relative;
        }

        h1 {
            color: #3F5A5E;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        .gif-container img {
            width: 200px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: #d81b60;
            color: white;
            font-weight: bold;
        }

        #noBtn {
            background-color: #e0e0e0;
            color: #333;
        }

        /* Message that appears after saying Yes */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="question-section">
            <div class="gif-container">
                <img id="main-image" src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3Y3A0OTZ5MjFzcHIwNTZuemVnYTU0MDkzZ3pyY292ZTN0NjI5bDM1bSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/XYEEvoX0Ub69ZgN9ai/giphy.gif" alt="Cute bear">
            </div>
            
            <h1 id="question">I know na it's kind a bit too late for this, but, tara Icecream?</h1>
            
            <div class="buttons">
                <button id="yesBtn" class="btn">Yes</button>
                <button id="noBtn" class="btn">No</button>
            </div>
        </div>

        <div id="success-section" class="hidden">
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbGdneHVhc2FidXgyYnIxbTV1NGI2YmR6dGVrcmQ1ZnJmNDZzdDBraCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/fUQ4rhUZJYiQsas6WD/giphy.gif" alt="Happy bear">
            </div>
            <h1>Yey! Kitakits! ❤️</h1>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionSection = document.getElementById('question-section');
        const successSection = document.getElementById('success-section');
        const questionText = document.getElementById('question');
        const mainImage = document.getElementById('main-image');

        // Phrases to cycle through when clicking "No"
        const noTexts = [
            "No",
            "Sure ba?",
            "Pleaseeeeeee!",
            "Sisig nalang ta",
            "HUHUHUHUHU minsan lng mn ito",
            "Vucket?",
            "Jasiiiiiiiiiiiiii",
            "BBQ?????",
            "Grumpy nalangggg",
            "Treat tka",
            "Mochiiiiiiiiiiii taaaaa",
            "Ano fave food mo?!!",
            "Minsan lang baya ako goodboi",
            "Last naniiiiii",
            "Sabay nalang ta kaonnnnn sa likod sa H next week",
            "Sure naka ani??",
        ];

        let noCount = 0;
        let yesFontSize = 1.2; // Initial font size in rem

        noBtn.addEventListener('click', () => {
            noCount++;
            
            // 1. Make the Yes button bigger
            yesFontSize *= 1.3; // Increase size by 30% each click
            yesBtn.style.fontSize = `${yesFontSize}rem`;
            
            // 2. Change the text on the No button
            // If we run out of phrases, just keep using the last one
            const textIndex = Math.min(noCount, noTexts.length - 1);
            noBtn.textContent = noTexts[textIndex];
        });

        yesBtn.addEventListener('click', () => {
            // Hide the question and show the success message
            questionSection.style.display = 'none';
            successSection.style.display = 'block';
            successSection.classList.remove('hidden');
        });
    </script>
</body>
</html>
